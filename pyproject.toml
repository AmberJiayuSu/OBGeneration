[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obgeneration"
version = "0.1.0"
description = "Occupancy generation models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "pytest-xdist>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ob_generation"]
include = ["src/ob_generation/data/**"]
