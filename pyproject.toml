[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obgeneration"
version = "0.1.1"
description = "Occupancy generation models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "pytest-xdist>=3.3.0",
]

[tool.uv.workspace]
members = ["validation"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/obgeneration",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obgeneration"]
only-packages = true
include = [
    "src/obgeneration/data/**/*.csv",
    "src/obgeneration/data/**/*.json",
]
