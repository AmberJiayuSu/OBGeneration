[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validation"
version = "0.1.0"
description = "NEEA to energy model conversion pipeline"
requires-python = ">=3.10"
dependencies = [
    "obgeneration",
    "requests>=2.31.0",
    "pvlib>=0.10.0",
    "ladybug-core>=0.44.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.3",
    "ipykernel>=7.2.0",
    "pyarrow>=23.0.1",
    "plotly>=6.7.0",
    "nbformat>=5.10.4",
    "geopandas>=1.1.3",
    "scikit-learn>=1.4.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
]

[tool.uv.sources]
obgeneration = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]
